# ============================================================================
# WormWise 🌱 Smart Farm - Telegraf Ingestion Configuration
# Milestone 6: Continuous Telemetry Ingestion (HiveMQ Cloud -> InfluxDB)
# ============================================================================

[agent]
  interval = "5s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "5s"
  flush_jitter = "0s"
  precision = "0s"
  hostname = "wormwise-ingestion-node"
  omit_hostname = false

# ----------------------------------------------------------------------------
# 1. INPUT: HiveMQ Cloud MQTT Telemetry Consumer
# ----------------------------------------------------------------------------
[[inputs.mqtt_consumer]]
  ## Broker endpoint (TLS on Port 8883)
  servers = ["${MQTT_BROKER_URL}"]

  ## Subscribe to all devices across all tenants and greenhouses
  topics = [
    "wormwise/+/+/+/+/telemetry"
  ]

  qos = 0
  connection_timeout = "30s"
  client_id = "wormwise-telegraf-ingestion"

  ## Authentication credentials
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"

  ## Parse topic hierarchy into indexed InfluxDB tags
  ## Pattern: wormwise/{tenant_id}/{farm_id}/{greenhouse_id}/{device_id}/telemetry
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "wormwise/+/+/+/+/telemetry"
    measurement = "_/_/_/_/_/measurement"
    tags = "_/tenant_id/farm_id/greenhouse_id/device_id/_"

  ## Data format configuration (JSON)
  data_format = "json"

  ## Extract device timestamp (RFC3339 / ISO 8601)
  json_time_key = "timestamp"
  json_time_format = "2006-01-02T15:04:05Z07:00"
  json_timezone = "UTC"

  ## String fields (excluded from tags to prevent high cardinality)
  json_string_fields = ["messageId", "deviceId"]

  ## Override measurement name
  name_override = "vermicompost_telemetry"

# ----------------------------------------------------------------------------
# 2. OUTPUT: InfluxDB v2 Time-Series Database
# ----------------------------------------------------------------------------
[[outputs.influxdb_v2]]
  ## InfluxDB URL (Local Docker or InfluxDB Cloud)
  urls = ["${INFLUXDB_URL}"]

  ## Access Token with Write permissions on the telemetry bucket
  token = "${INFLUXDB_TOKEN}"

  ## Organization and Bucket
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"

  ## Recovery and buffering behavior during outages
  timeout = "10s"
  ping_timeout = "5s"
